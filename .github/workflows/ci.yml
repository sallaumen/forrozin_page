name: CI

# A branch with an open PR used to fire both triggers, so every commit ran the
# whole matrix twice. Two runs of the same commit means twice the minutes and
# twice the exposure to any flake: on #223, #228 and #229 one of the pair went
# red while its twin went green on the very same sha.
#
# `push` on main is the health check of the default branch after a merge; every
# other branch is covered by `pull_request`.
on:
  push:
    branches:
      - main
  pull_request:

# Pushing a new commit to a PR makes the previous run pointless. Main is left
# alone: its runs are the record of what merged, not work in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MIX_ENV: test

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: forrozin
          POSTGRES_PASSWORD: forrozin
          POSTGRES_DB: o_grupo_de_estudos_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.19.5-otp-27"

      - name: Restore deps/build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # No TEST_MAX_CASES here on purpose. It used to be 16, on the theory that
      # a runner with nothing else to do should use every core. Measured against
      # the coverage job, which runs the same suite with the derived default,
      # the override bought nothing: 173.4s vs 175.0s, 219.9s vs 219.8s, 206.5s
      # vs 210.6s, 215.7s vs 220.8s. The bottleneck is the Postgres container
      # sharing the runner, not the schedulers.
      #
      # What it did buy was the flake. Sixteen cases on a four-core runner
      # starve each other while each one holds a sandbox connection, and the
      # checkout dies at 15000ms in whatever test happened to be running. The
      # coverage job never failed once; this one failed three times.
      - name: Run tests
        run: mix test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: forrozin
          POSTGRES_PASSWORD: forrozin
          POSTGRES_DB: o_grupo_de_estudos_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.19.5-otp-27"

      - name: Restore deps/build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Coverage (minimo em coveralls.json)
        run: mix coveralls

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.19.5-otp-27"

      # Cache proprio: inclui o PLT (em _build/dev), caro de reconstruir.
      - name: Restore deps/build/PLT cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-dev-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Dialyzer
        run: mix dialyzer

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.19.5-otp-27"

      - name: Restore deps/build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Format, audit, sobelow, credo
        run: mix lint
